version = 3
final_space = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    leading_diamond = '╭─'
    template = ' {{ if .WSL }} on {{ end }}{{ .Icon }}  '
    foreground = '#ffffff'
    background = '#0c7bbb'
    type = 'os'
    style = 'diamond'

    [blocks.segments.properties]
      alpine = ''
      arch = ''
      centos = ''
      debian = ''
      elementary = ''
      fedora = ''
      gentoo = ''
      linux = ''
      macos = ''
      manjaro = ''
      mint = ''
      opensuse = ''
      raspbian = ''
      ubuntu = ''
      windows = ''

  [[blocks.segments]]
    template = ' {{ .Path }} '
    foreground = '#ffffff'
    powerline_symbol = ''
    background = '#8a62da'
    type = 'path'
    style = 'powerline'

    [blocks.segments.properties]
      style = 'full'

[[blocks]]
  type = 'prompt'
  alignment = 'right'

  [[blocks.segments]]
    template = '<#cc7eda> | </><#7eb8da></> {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }}'
    foreground = '#81ff91'
    type = 'node'
    style = 'powerline'

    [blocks.segments.properties]
      fetch_version = true

  [[blocks.segments]]
    template = '<#cc7eda> | </><#7eb8da></> {{ .Full }}'
    foreground = '#81ff91'
    type = 'php'
    style = 'powerline'

  [[blocks.segments]]
    template = '<#cc7eda> | </><#7eb8da> </> {{ .Full }}'
    foreground = '#81ff91'
    type = 'npm'
    style = 'powerline'

  [[blocks.segments]]
    template = '<> </>'
    foreground = '#81ff91'
    type = 'sysinfo'
    style = 'powerline'

  [[blocks.segments]]
    leading_diamond = ''
    trailing_diamond = ''
    template = '⌛  {{ .FormattedMs }} '
    foreground = '#4b4b4b'
    background = '#cecece'
    type = 'executiontime'
    style = 'diamond'

    [blocks.segments.properties]
      style = 'austin'
      threshold = 150.0

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = '╰─'
    foreground = '#0c7bbb'
    type = 'text'
    style = 'plain'

[transient_prompt]
  background = "transparent"
  foreground = "#ffffff"
  template = "{{ .PWD }} > "