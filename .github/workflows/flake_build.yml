name: Check, Build, and Push Flake Config to Cachix

env:
  EXTRA_NIX_CONFIG: |
    auto-optimise-store = true
    experimental-features = nix-command flakes
    max-jobs = auto
    download-buffer-size = 500000000
    substituters = https://jocimsus.cachix.org https://cache.nixos.org https://nix-community.cachix.org https://prismlauncher.cachix.org
    trusted-public-keys = jocimsus.cachix.org-1:JLglEO54KxFNzvLZlz6MxvYap/7gJLK0w+jT8GRHrXw= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= prismlauncher.cachix.org-1:9/n/FGyABA2jLUVfY+DEp4hKds/rwO+SCOtbOkDzd+c=

on:
  push:
    branches:
      - main
    paths:
      - '**.nix'
      - 'flake.lock'
      - 'hosts/**'
      - 'modules/**'
      - 'pkgs/**'
  pull_request:
    branches:
      - main
    paths:
      - '**.nix'
      - 'flake.lock'
      - 'hosts/**'
      - 'modules/**'
      - 'pkgs/**'
  workflow_dispatch:
    inputs:
      specific_host:
        description: "Build only a specific host (leave empty for all)"
        required: false
        type: string
      timeout_minutes:
        description: "Timeout for build jobs in minutes"
        required: true
        type: number
        default: 180

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_build:
    name: Prepare Build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: ${{ env.EXTRA_NIX_CONFIG }}

      - name: Run Flake Check
        uses: DeterminateSystems/flake-checker-action@main

      - name: Flake check
        run: |
          nix flake check

      - name: Generate matrix from nixosConfigurations
        id: set-matrix
        run: |
          if [ -n "${{ github.event.inputs.specific_host }}" ]; then
            # If a specific host was provided, only build that one
            HOSTS=$(echo '["${{ github.event.inputs.specific_host }}"]' | jq -c .)
          else
            # Otherwise build all hosts from the flake
            HOSTS=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames | jq -c '[values[]]')
          fi
          echo "matrix={\"hostname\":$HOSTS}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.hostname }}
    needs: [prepare_build]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.timeout_minutes || 180 }} # Use input parameter or default to 180 minutes
    strategy:
      fail-fast: true # Stop all matrix jobs if one fails
      matrix: ${{fromJson(needs.prepare_build.outputs.matrix)}}
    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: ${{ env.EXTRA_NIX_CONFIG }}

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: jocimsus
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build NixOS configuration
        id: build
        run: |
          set -o pipefail
          echo "Starting Nix build for ${{ matrix.hostname }}..."
          mkdir -p logs
          start_time=$(date +%s)
          cachix watch-exec jocimsus -- \
            nix build .#nixosConfigurations.${{ matrix.hostname }}.config.system.build.toplevel \
            -L --print-build-logs --out-link result-${{ matrix.hostname }} 2>&1 | tee logs/build_output.log
          end_time=$(date +%s)
          build_duration=$((end_time - start_time))
          echo "Build duration: $build_duration seconds"
          echo "build_duration=$build_duration" >> $GITHUB_OUTPUT

      - name: Push to Cachix
        run: |
          cachix push jocimsus ./result*

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-${{ matrix.hostname }}
          path: logs/
          retention-days: 5
