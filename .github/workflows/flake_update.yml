name: Update Flakes

on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  get-flake-inputs:
    name: Get latest flake inputs
    runs-on: ubuntu-latest
    outputs:
      flake-inputs: ${{ steps.get-flake-inputs.outputs.flake-inputs }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: flake.lock

      - id: get-flake-inputs
        run: |
          if [ -f flake.lock ]; then
            flake_inputs="$(jq -c '.nodes.root.inputs | {flake: keys}' flake.lock)"
          else
            echo "flake.lock not found. Assuming no inputs for update."
            flake_inputs='{"flake":[]}'
          fi
          echo "flake-inputs=${flake_inputs}" >> "$GITHUB_OUTPUT"

  update-flake-inputs:
    name: update-${{ matrix.flake }}
    runs-on: ubuntu-latest
    needs: get-flake-inputs
    if: ${{ fromJson(needs.get-flake-inputs.outputs.flake-inputs).flake != '[]' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-flake-inputs.outputs.flake-inputs) }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Generate App Token
        id: generate_token
        uses: peter-murray/workflow-application-token-action@v4
        with:
          application_id: ${{ secrets.APP_ID }}
          application_private_key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure Git for FlakeBuildApp
        run: |
          git config --global user.email "flakebuild[bot]@users.noreply.github.com"
          git config --global user.name "flakebuild[bot]"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v18
        with:
          extra-conf: accept-flake-config = true

      - name: Update Flake & Create PR
        uses: cpcloud/flake-update-action@v2.0.1
        with:
          dependency: ${{ matrix.flake }}
          pull-request-token: ${{ steps.generate_token.outputs.token }}
          github-token: ${{ steps.generate_token.outputs.token }}
          pull-request-branch-prefix: update-
          pull-request-author: "flakebuild[bot] <flakebuild[bot]@users.noreply.github.com>"
          delete-branch: true
          automerge: true
